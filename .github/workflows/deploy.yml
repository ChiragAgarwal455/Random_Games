name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build paper-and-pour
        working-directory: ./paper-and-pour
        run: |
          npm install
          npm run build

      - name: Prepare site folder
        run: |
          mkdir -p _site/paper-and-pour
          cp -r paper-and-pour/dist/* _site/paper-and-pour/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - uses: actions/deploy-pages@v4
